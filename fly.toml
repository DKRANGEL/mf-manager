# fly.toml app configuration file generated for tiny-recibo-pro on 2026-03-01T13:28:52-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

auto_stop_machines = 'stop'
min_machines_running = 1
app = 'tiny-recibo-pro'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1

[mounts]
source = "mf_data"
destination = "/app/src/data"
