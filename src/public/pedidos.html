<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - MF Manager</title>
    <link rel="icon" type="image/jpeg" href="/public/MagicFireworksLogo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/public/css/app.css">
    <link rel="stylesheet" href="/public/css/documento.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            overflow: auto;
            background: #09090a;
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 28px 20px 80px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        .page-header .sub {
            font-size: 11px;
            color: #555;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: .15s;
            font-family: inherit;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-white {
            background: #fff;
            color: #000;
        }

        .btn-white:hover {
            background: #e0e0e0;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid #333;
            color: #888;
        }

        .btn-ghost:hover {
            border-color: #555;
            color: #fff;
        }

        /* ── FILTROS ── */
        .filtros-wrapper {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filtros-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filtro-btn {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #29292e;
            background: transparent;
            color: #555;
            font-family: inherit;
            transition: .15s;
            -webkit-tap-highlight-color: transparent;
        }

        .filtro-btn.ativo {
            background: #222;
            border-color: #555;
            color: #ccc;
        }

        .filtro-btn:hover { border-color: #444; color: #ccc; }

        .filtro-btn.pendente.ativo  { background: rgba(251,191,36,.12); border-color: #fbbf24; color: #fbbf24; }
        .filtro-btn.aberto.ativo    { background: rgba(239,68,68,.12);  border-color: #ef4444; color: #ef4444; }
        .filtro-btn.concluido.ativo { background: rgba(74,222,128,.12); border-color: #4ade80; color: #4ade80; }

        .data-input {
            height: 32px; background: #121214; border: 1px solid #29292e;
            border-radius: 20px; padding: 0 12px; color: #666; font-size: 11px;
            font-family: inherit; outline: none; cursor: pointer;
        }
        .data-input:focus { border-color: #444; color: #ccc; }

        /* ── STATUS DROPDOWN no card ── */
        .status-select {
            width: 100%; border: none; border-top: 1px solid #1e1e22;
            background: #0e0e10; color: #888; font-size: 12px; font-weight: 700;
            padding: 10px 14px; font-family: inherit; cursor: pointer;
            appearance: none; -webkit-appearance: none; text-align: center;
            transition: .15s; outline: none;
        }
        .status-select:hover { background: #141416; }
        .status-select.pendente  { color: #fbbf24; }
        .status-select.aberto    { color: #ef4444; }
        .status-select.concluido { color: #4ade80; }

        .pedidos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
        }

        .pedido-card {
            background: #121214;
            border: 1px solid #29292e;
            border-radius: 12px;
            overflow: hidden;
            transition: border-color .15s, transform .15s;
            display: flex;
            flex-direction: column;
        }

        .pedido-card:hover {
            border-color: #444;
            transform: translateY(-2px);
        }

        .card-thumb {
            width: 100%;
            aspect-ratio: 4/3;
            background: #1a1a1e;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid #1e1e22;
            cursor: pointer;
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-thumb-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 6px;
        }

        .card-thumb-initials {
            font-size: 28px;
            font-weight: 800;
            color: #333;
            letter-spacing: -1px;
            line-height: 1;
        }

        .card-thumb-icon {
            font-size: 32px;
            opacity: .3;
        }

        .card-thumb-num {
            font-family: var(--mono);
            font-size: 10px;
            color: #3a3a3f;
            position: absolute;
            bottom: 6px;
            right: 8px;
        }

        .card-status {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            padding: 2px 7px;
            border-radius: 4px;
        }

        .status-rascunho, .status-pendente {
            background: rgba(251, 191, 36, .15);
            color: #fbbf24;
        }

        .status-emitido, .status-aberto {
            background: rgba(239, 68, 68, .15);
            color: #ef4444;
        }

        .status-concluido {
            background: rgba(74, 222, 128, .15);
            color: #4ade80;
        }

        .card-info {
            padding: 12px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
        }

        .card-cliente {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 11px;
            color: #555;
        }

        .card-total {
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 700;
            color: #ccc;
            margin-top: 4px;
        }

        .card-total.zero {
            color: #444;
        }

        .card-actions {
            display: flex;
            border-top: 1px solid #1e1e22;
        }

        .card-btn {
            flex: 1;
            background: none;
            border: none;
            color: #444;
            font-size: 16px;
            cursor: pointer;
            padding: 10px;
            transition: .15s;
            font-family: inherit;
        }

        .card-btn:hover {
            color: #ccc;
            background: rgba(255, 255, 255, .04);
        }

        .card-btn.danger:hover {
            color: #f87171;
            background: rgba(220, 38, 38, .08);
        }

        .card-btn.emitido {
            color: #4ade80;
        }

        .card-btn + .card-btn {
            border-left: 1px solid #1e1e22;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #444;
            grid-column: 1/-1;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: .3;
        }

        .empty p {
            font-size: 13px;
            margin-top: 6px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #555;
            font-size: 13px;
            grid-column: 1/-1;
        }

        #previewModal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .9);
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 12px 0 40px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #previewModal.ativo {
            display: flex;
        }

        .preview-toolbar {
            width: 100%;
            max-width: 760px;
            padding: 0 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-shrink: 0;
            gap: 10px;
            flex-wrap: wrap;
            box-sizing: border-box;
        }

        .preview-nome-arquivo {
            flex: 1;
            min-width: 180px;
            background: #1a1a1e;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
            outline: none;
        }

        .preview-nome-arquivo:focus {
            border-color: #555;
        }

        .preview-btns {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        #previewContent {
            width: 760px;
            background: #fff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
            transform-origin: top left;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .page {
                padding: 16px 14px 60px;
            }

            .header-actions {
                width: 100%;
                flex-wrap: wrap;
            }

            .header-actions .btn {
                flex: 1;
                justify-content: center;
                min-width: 0;
            }

            .pedidos-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .card-info {
                padding: 10px 12px;
            }

            .card-cliente {
                font-size: 12px;
            }

            .card-total {
                font-size: 12px;
            }
        }

        @media (max-width: 400px) {
            .pedidos-grid {
                grid-template-columns: 1fr;
            }
        }

        @media print {
            body > .page, #previewModal .preview-toolbar {
                display: none !important;
            }

            #previewModal {
                position: static !important;
                background: #fff !important;
                padding: 0 !important;
                display: block !important;
            }

            #previewContent {
                box-shadow: none !important;
                transform: none !important;
                width: 100% !important;
            }
        }
    </style>
</head>
<body>

<div id="previewModal">
    <div class="preview-toolbar">
        <input type="text" class="preview-nome-arquivo" id="nomeArquivo"
               placeholder="Nome do arquivo (ex: Pedido Marcio)">
        <div class="preview-btns">
            <button onclick="imprimirPreview()"
                    style="background:#fff;color:#000;border:none;padding:8px 16px;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;">
                <i data-lucide="printer"></i> Imprimir
            </button>
            <button onclick="fecharPreview()"
                    style="background:#333;color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer;">
                <i data-lucide="x"></i>
            </button>
        </div>
    </div>
    <div id="previewContent" style="width:760px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5);transform-origin:top left;"></div>
</div>

<div class="page">
    <div class="page-header">
        <div>
            <h1>Pedidos</h1>
            <div class="sub">MF Manager · Magic Fireworks</div>
        </div>
        <div class="header-actions">
            <a href="/" class="btn btn-ghost">← Início</a>
            <a href="/emitir" class="btn btn-white"><i data-lucide="pencil"></i> Novo Pedido</a>
        </div>
    </div>
    <div class="filtros-wrapper">
        <div class="filtros-row">
            <button class="filtro-btn ativo"               onclick="setFiltroStatus('todos')">Todos</button>
            <button class="filtro-btn pendente"             onclick="setFiltroStatus('pendente')">🟡 Pendente</button>
            <button class="filtro-btn aberto"               onclick="setFiltroStatus('aberto')">🔴 Aberto</button>
            <button class="filtro-btn concluido"            onclick="setFiltroStatus('concluido')">🟢 Concluído</button>
        </div>
        <div class="filtros-row">
            <button class="filtro-btn ativo" data-periodo="todos"  onclick="setFiltroPeriodo(this)">Todos</button>
            <button class="filtro-btn" data-periodo="hoje"         onclick="setFiltroPeriodo(this)">Hoje</button>
            <button class="filtro-btn" data-periodo="semana"       onclick="setFiltroPeriodo(this)">Semana</button>
            <button class="filtro-btn" data-periodo="mes"          onclick="setFiltroPeriodo(this)">Mês</button>
            <input type="date" class="data-input" id="filtroInicio" onchange="setFiltroPeriodo(null,'custom')" title="Data início">
            <input type="date" class="data-input" id="filtroFim"    onchange="setFiltroPeriodo(null,'custom')" title="Data fim">
        </div>
    </div>
    <div id="pedidosGrid" class="pedidos-grid">
        <div class="loading">Carregando pedidos...</div>
    </div>
</div>

<script>
    let todosPedidos = [];
    let filtroStatus = 'todos';
    let filtroPeriodo = 'todos';

    document.addEventListener('DOMContentLoaded', carregarPedidos);

    async function carregarPedidos() {
        try {
            const res = await fetch('/api/pedidos');
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            todosPedidos = (json.data || []).sort((a, b) =>
                new Date(b.data_atualizacao || b.data_emissao) - new Date(a.data_atualizacao || a.data_emissao)
            );
            renderGrid();
        } catch (err) {
            document.getElementById('pedidosGrid').innerHTML = `<div class="empty"><p>Erro ao carregar: ${err.message}</p></div>`;
        }
    }

    // ── FILTROS DE STATUS ──
    function setFiltroStatus(status) {
        filtroStatus = status;
        document.querySelectorAll('.filtros-row:first-child .filtro-btn').forEach(b => b.classList.remove('ativo'));
        const btns = document.querySelectorAll('.filtros-row:first-child .filtro-btn');
        const idx = ['todos','pendente','aberto','concluido'].indexOf(status);
        if (btns[idx]) btns[idx].classList.add('ativo');
        renderGrid();
    }

    // ── FILTROS DE PERÍODO ──
    function setFiltroPeriodo(btn, override) {
        filtroPeriodo = override || btn?.dataset.periodo || 'todos';
        document.querySelectorAll('[data-periodo]').forEach(b => b.classList.remove('ativo'));
        if (btn) btn.classList.add('ativo');
        renderGrid();
    }

    function filtrarPedidos(pedidos) {
        let lista = pedidos;

        // Filtro de status
        if (filtroStatus !== 'todos') {
            lista = lista.filter(ped => {
                const s = ped.status || 'rascunho';
                if (filtroStatus === 'pendente') return s === 'rascunho' || s === 'pendente';
                if (filtroStatus === 'aberto')   return s === 'emitido'  || s === 'aberto';
                if (filtroStatus === 'concluido') return s === 'concluido';
                return true;
            });
        }

        // Filtro de período
        if (filtroPeriodo !== 'todos') {
            const agora = new Date();
            const hoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
            const ini = document.getElementById('filtroInicio')?.value;
            const fim = document.getElementById('filtroFim')?.value;

            lista = lista.filter(ped => {
                const d = new Date(ped.data_atualizacao || ped.data_emissao);
                if (filtroPeriodo === 'hoje')   return d >= hoje;
                if (filtroPeriodo === 'semana') { const s = new Date(hoje); s.setDate(hoje.getDate()-7); return d >= s; }
                if (filtroPeriodo === 'mes')    return d >= new Date(agora.getFullYear(), agora.getMonth(), 1);
                if (filtroPeriodo === 'custom') {
                    const dStr = d.toISOString().split('T')[0];
                    if (ini && dStr < ini) return false;
                    if (fim && dStr > fim) return false;
                    return true;
                }
                return true;
            });
        }

        return lista;
    }

    function getInitials(nome) {
        if (!nome) return '?';
        return nome.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    }

    function renderGrid() {
        const container = document.getElementById('pedidosGrid');
        const lista = filtrarPedidos(todosPedidos);

        if (lista.length === 0) {
            container.innerHTML = `<div class="empty">
            <div class="empty-icon"><i data-lucide="file-text"></i></div>
            <div style="color:#555;font-size:14px;font-weight:600;">Nenhum pedido encontrado</div>
            <p>Crie um novo pedido para começar</p>
        </div>`;
            return;
        }

        container.innerHTML = lista.map(ped => {

            const cliente = ped.cliente || '';
            const subtotal = ped.total_valor || 0;
            const totalStr = subtotal > 0 ? fmtMoney(subtotal) : 'Sem valor';
            const totalClass = subtotal > 0 ? '' : 'zero';
            const data = formatData(ped.data_atualizacao || ped.data_emissao);
            const status = ped.status || 'rascunho';
            const isPendente  = status === 'rascunho' || status === 'pendente';
            const isAberto    = status === 'emitido'  || status === 'aberto';
            const isConcluido = status === 'concluido';
            const initials = getInitials(cliente);

            const statusClass = isPendente ? 'status-rascunho' : isAberto ? 'status-emitido' : 'status-concluido';
            const statusLabel = isPendente ? 'PENDENTE' : isAberto ? 'ABERTO' : 'CONCLUÍDO';
            const selectClass = isPendente ? 'pendente' : isAberto ? 'aberto' : 'concluido';

            const thumbImg = ped.primeira_imagem
                ? `<img src="/data/produtos/${esc(ped.primeira_imagem)}" alt="">`
                : `<div class="card-thumb-placeholder">
                <div class="card-thumb-initials">${esc(initials)}</div>
                <div class="card-thumb-icon"><i data-lucide="file-text"></i></div>
               </div>`;

            return `<div class="pedido-card">
            <div class="card-thumb" onclick="abrirEditar('${esc(ped.numero)}')">
                ${thumbImg}
                <span class="card-status ${statusClass}">${statusLabel}</span>
                <span class="card-thumb-num">${esc(ped.numero)}</span>
            </div>
            <div class="card-info" onclick="abrirEditar('${esc(ped.numero)}')">
                <div class="card-cliente">${esc(cliente || 'Sem cliente')}</div>
                <div class="card-meta">${data} · ${ped.total_itens} ${ped.total_itens === 1 ? 'item' : 'itens'}</div>
                <div class="card-total ${totalClass}">${totalStr}</div>
            </div>
            <select class="status-select ${selectClass}" onchange="mudarStatus('${esc(ped.numero)}', this.value, this)">
                <option value="rascunho" ${isPendente  ? 'selected' : ''}>🟡 Pendente</option>
                <option value="emitido"  ${isAberto    ? 'selected' : ''}>🔴 Aberto</option>
                <option value="concluido"${isConcluido ? 'selected' : ''}>🟢 Concluído</option>
            </select>
            <div class="card-actions">
                <button class="card-btn" onclick="abrirPreview('${esc(ped.numero)}', '${esc(cliente)}')" title="Preview"><i data-lucide="eye"></i></button>
                <button class="card-btn" onclick="abrirEditar('${esc(ped.numero)}')" title="Editar"><i data-lucide="pencil"></i></button>
                <button class="card-btn danger" onclick="deletarPedido('${esc(ped.numero)}', '${esc(cliente)}')" title="Excluir"><i data-lucide="trash-2"></i></button>
            </div>
        </div>`;
        }).join('');
        lucide.createIcons();
    }

    function abrirEditar(numero) {
        window.location.href = `/emitir?numero=${encodeURIComponent(numero)}`;
    }

    async function mudarStatus(numero, novoStatus, selectEl) {
        const pedido = todosPedidos.find(p => p.numero === numero);
        const atual = pedido?.status || 'rascunho';
        if (atual === novoStatus || (atual === 'pendente' && novoStatus === 'rascunho')) { return; }

        const msgs = {
            'rascunho→emitido':   `Baixar estoque do pedido ${numero}?\n\nOs itens serão descontados do estoque.`,
            'emitido→rascunho':   `Reverter baixa do pedido ${numero}?\n\nOs itens voltam ao estoque.`,
            'emitido→concluido':  `Confirmar pagamento do pedido ${numero}?\n\nMarcar como CONCLUÍDO.`,
            'concluido→emitido':  `Reabrir pagamento do pedido ${numero}?\n\nVolta para ABERTO.`,
            'rascunho→concluido': `Não é possível ir direto para Concluído sem antes baixar o estoque.`,
            'concluido→rascunho': `Não é possível voltar para Pendente a partir de Concluído.\nPrimeiro reabra para Aberto.`,
        };

        const chave = `${atual}→${novoStatus}`;
        const msg = msgs[chave];

        if (!msg) { renderGrid(); return; }
        if (chave.includes('Não é possível')) { alert(msg); renderGrid(); return; }
        if (!confirm(msg)) { renderGrid(); return; }

        let url, body;
        if (chave === 'rascunho→emitido') { url = `/api/pedidos/${numero}/baixa`;    body = {ativar: true}; }
        if (chave === 'emitido→rascunho') { url = `/api/pedidos/${numero}/baixa`;    body = {ativar: false}; }
        if (chave === 'emitido→concluido'){ url = `/api/pedidos/${numero}/concluir`; body = {ativar: true}; }
        if (chave === 'concluido→emitido'){ url = `/api/pedidos/${numero}/concluir`; body = {ativar: false}; }

        try {
            const res = await fetch(url, {
                method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
            });
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            await carregarPedidos();
        } catch (err) {
            alert('Erro: ' + err.message);
            renderGrid();
        }
    }

    async function abrirPreview(numero, cliente) {
        try {
            const resP = await fetch(`/api/pedidos/${encodeURIComponent(numero)}`).then(r => r.json());
            if (!resP.success) throw new Error(resP.error);
            document.getElementById('previewContent').innerHTML = gerarPedidoMFHTML(resP.data);
            document.getElementById('nomeArquivo').value = cliente ? `Pedido ${cliente}` : numero;
            document.getElementById('previewModal').classList.add('ativo');
            setTimeout(escalarPreview, 50);
        } catch (err) {
            alert('Erro ao carregar preview: ' + err.message);
        }
    }

    function escalarPreview() {
        const content = document.getElementById('previewContent');
        const modal = document.getElementById('previewModal');
        if (!content || !modal) return;
        const escala = Math.min(1, (window.innerWidth - 24) / 760);
        content.style.transformOrigin = 'top center';
        content.style.transform = `scale(${escala})`;
        content.style.marginTop = '0';
        content.style.marginLeft = '0';
        content.style.marginBottom = escala < 1
            ? `${-(content.offsetHeight * (1 - escala))}px`
            : '0';
    }

    window.addEventListener('resize', escalarPreview);

    function fecharPreview() {
        document.getElementById('previewModal').classList.remove('ativo');
    }

    function imprimirPreview() {
        const nome = document.getElementById('nomeArquivo').value.trim();
        if (nome) document.title = nome;
        window.print();
        setTimeout(() => {
            document.title = 'Pedidos - MF Manager';
        }, 1000);
    }

    async function deletarPedido(numero, cliente) {
        if (!confirm(`Excluir pedido ${numero}${cliente ? ` de "${cliente}"` : ''}?`)) return;
        try {
            const res = await fetch(`/api/pedidos/${encodeURIComponent(numero)}`, {method: 'DELETE'});
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            todosPedidos = todosPedidos.filter(ped => ped.numero !== numero);
            renderGrid();
        } catch (err) {
            alert('Erro ao excluir: ' + err.message);
        }
    }

    function hide(id) {
        const e = document.getElementById(id);
        if (e) e.style.display = 'none';
    }

    function fmtMoney(v) {
        return 'R$ ' + (v || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function formatData(d) {
        if (!d) return '-';
        return new Date(d).toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit', year: 'numeric'});
    }

    function esc(s) {
        if (!s) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
</script>
<script src="/public/js/documento.js"></script>
</body>
</html>
