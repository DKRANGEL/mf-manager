<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Recibo Pro - Magic Fireworks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/public/css/app.css">
    <link rel="stylesheet" href="/public/css/documento.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-icon">🧾</div>
                <div>
                    <h1>TINY RECIBO</h1>
                    <span class="brand-sub">Magic Fireworks</span>
                </div>
            </div>
        </div>

        <div class="sidebar-content">
            <!-- ===== TOGGLE DE MODO ===== -->
            <div class="input-group">
                <label>Tipo de Documento</label>
                <div class="toggle-group">
                    <button class="toggle active" data-mode="pedido" onclick="setModo(this)">Pedido de Venda</button>
                    <button class="toggle" data-mode="equipamento" onclick="setModo(this)">Ordem Equipamento</button>
                </div>
            </div>

            <!-- ===== MODO: PEDIDO DE VENDA ===== -->
            <div id="modoPedido">
                <div class="input-group">
                    <label for="pedidoId">Buscar Pedido</label>
                    <div class="input-row">
                        <input type="text" id="pedidoId" placeholder="Nº do Pedido..." autocomplete="off">
                        <button id="btnGerar" onclick="gerarRecibo()">GERAR</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Critério de Busca</label>
                    <div class="toggle-group">
                        <button class="toggle active" data-type="numero" onclick="setTipo(this)">Número Pedido</button>
                        <button class="toggle" data-type="id" onclick="setTipo(this)">ID Interno</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Relatórios</label>
                    <button class="btn-export" onclick="gerarInventarioProdutos()"
                            style="background: #323238; color: #e1e1e6;">
                        📦 Inventário de Produtos (PDF)
                    </button>
                </div>
            </div>

            <!-- ===== MODO: ORDEM DE EQUIPAMENTO ===== -->
            <div id="modoEquipamento" style="display:none;">
                <!-- Ações principais -->
                <div class="input-group">
                    <label>Ações</label>
                    <button class="btn-export" onclick="novaOrdem()" style="background: var(--sb-accent); color: #fff;">
                        ＋ Nova Ordem de Equipamento
                    </button>
                    <div class="input-row" style="margin-top: 8px;">
                        <input type="text" id="osBusca" placeholder="Nº da OS (ex: 1, 2, 3...)" autocomplete="off">
                        <button id="btnGerarOS" onclick="buscarOS()">IR</button>
                    </div>
                </div>

                <!-- Link pra cadastro -->
                <a href="/equipamentos" class="btn-link-equip" target="_blank">
                    📦 Gerenciar Cadastro de Equipamentos
                </a>

                <!-- Inventário PDF -->
                <button class="btn-export" onclick="gerarInventario()"
                        style="background: #323238; color: #e1e1e6; margin-bottom: 16px;">
                    📋 Gerar Inventário Geral (PDF)
                </button>

                <div id="osFormulario" style="display:none;">
                    <div class="input-group">
                        <label for="osEvento">Nome do Evento</label>
                        <input type="text" id="osEvento" class="sidebar-input" placeholder="Ex: Show Henrique & Juliano"
                               list="listaEventos">
                        <datalist id="listaEventos"></datalist>
                    </div>

                    <div class="input-group">
                        <label for="osLocal">Local</label>
                        <input type="text" id="osLocal" class="sidebar-input" placeholder="Ex: Arena BRB Mané Garrincha"
                               list="listaLocais">
                        <datalist id="listaLocais"></datalist>
                    </div>

                    <div class="input-group">
                        <label>Datas</label>
                        <div class="input-row">
                            <input type="date" id="osDataSaida" class="sidebar-input" title="Data de Saída">
                            <input type="date" id="osDataRetorno" class="sidebar-input" title="Data de Retorno">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="osRespEntrega">Responsável pela Entrega</label>
                        <input type="text" id="osRespEntrega" class="sidebar-input" placeholder="Nome do responsável"
                               list="listaRespEntrega">
                        <datalist id="listaRespEntrega"></datalist>
                    </div>

                    <div class="input-group">
                        <label for="osRespEquip">Responsável pelo Equipamento</label>
                        <input type="text" id="osRespEquip" class="sidebar-input" placeholder="Nome do responsável"
                               list="listaRespEquip">
                        <datalist id="listaRespEquip"></datalist>
                    </div>

                    <div class="input-group">
                        <label>Adicionar Equipamentos</label>
                        <div class="input-row">
                            <input type="text" id="osBuscaProduto" class="sidebar-input"
                                   placeholder="Buscar por nome ou código...">
                            <button class="btn-accent-sm" onclick="buscarProdutos()">🔍</button>
                        </div>
                        <div id="resultadosProdutos" class="search-results" style="display:none;"></div>
                    </div>

                    <div id="osItensLista" class="os-itens-lista"></div>

                    <div class="input-group">
                        <label for="osObs">Observações</label>
                        <textarea id="osObs" class="sidebar-textarea" placeholder="Observações opcionais..."
                                  rows="2"></textarea>
                    </div>

                    <button class="btn-export" onclick="gerarOrdemEquipamento()" style="margin-top: 10px;">
                        📋 Gerar Ordem de Equipamento
                    </button>
                </div>
            </div>

            <!-- ===== COMUNS ===== -->
            <div id="errorBox" class="error-box" style="display:none;"></div>
            <div id="successBox" class="success-box" style="display:none;"></div>

            <div id="exportActions" class="export-actions" style="display:none;">
                <h3>Finalizar</h3>
                <button class="btn-export" onclick="exportarPDF()">
                    📄 Salvar PDF / Imprimir
                </button>
            </div>

            <div class="upload-section" id="uploadSection">
                <h3>Fotos dos Produtos</h3>
                <div class="upload-dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
                    <p class="upload-hint">Arraste ou clique para adicionar</p>
                    <button class="btn-upload">Selecionar Imagens</button>
                    <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFiles(this.files)"
                           style="display:none;">
                </div>
            </div>

            <div class="connection-test">
                <button class="btn-test" onclick="testarConexao()">🔌 Verificar Conexão API</button>
            </div>
        </div>

        <div class="sidebar-footer">
            <span>Sistema v4.0 • Magic Fireworks</span>
        </div>
    </aside>

    <main class="preview-area">
        <div id="emptyState" class="empty-state">
            <div class="empty-icon">📋</div>
            <h2>Pronto para gerar</h2>
            <p>Escolha o tipo de documento e preencha os dados</p>
        </div>

        <div id="reciboWrapper" class="recibo-wrapper" style="display:none;">
            <div id="recibo" class="recibo"></div>
        </div>
    </main>
</div>
<script src="/public/js/documento.js"></script>
<script src="/public/js/app.js"></script>
</body>
</html>
