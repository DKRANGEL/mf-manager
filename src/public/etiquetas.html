<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas QR — MF Manager</title>
    <link rel="icon" type="image/jpeg" href="/public/MagicFireworksLogo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { overflow: auto; background: #050505; }
        .page-container { max-width: 960px; margin: 0 auto; padding: 32px 20px 60px; }

        /* ── HEADER ── */
        .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; gap:12px; flex-wrap:wrap; }
        .page-header h1 { font-size:22px; font-weight:700; color:#fff; }
        .page-header .sub { font-size:10px; color:#555; font-weight:600; text-transform:uppercase; letter-spacing:1.2px; margin-top:4px; display:block; }

        /* ── BOTÕES ── */
        .btn-ghost { background:transparent; border:1px solid #333; color:#888; padding:9px 16px; border-radius:var(--sb-radius); font-size:13px; cursor:pointer; text-decoration:none; transition:0.15s; font-family:var(--font); display:inline-flex; align-items:center; gap:6px; }
        .btn-ghost:hover { border-color:#555; color:#fff; }
        .btn-primary { background:#fff; border:none; color:#000; padding:9px 20px; border-radius:var(--sb-radius); font-size:13px; font-weight:700; cursor:pointer; transition:0.15s; font-family:var(--font); display:inline-flex; align-items:center; gap:6px; }
        .btn-primary:hover { background:#e0e0e0; }
        .btn-add { background:rgba(255,255,255,0.06); border:1px solid #333; color:#ccc; padding:10px 20px; border-radius:var(--sb-radius); font-size:13px; font-weight:700; cursor:pointer; transition:0.15s; font-family:var(--font); display:inline-flex; align-items:center; gap:6px; width:100%; justify-content:center; margin-top:8px; }
        .btn-add:hover { background:rgba(255,255,255,0.1); border-color:#555; }
        .btn-add:disabled { opacity:0.4; cursor:not-allowed; }

        /* ── LAYOUT ── */
        .layout { display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:start; }

        /* ── CONFIGURADOR ── */
        .config-panel { display:flex; flex-direction:column; gap:12px; }
        .card { background:#121214; border:1px solid #29292e; border-radius:12px; padding:18px; }
        .card-title { font-size:10px; font-weight:700; color:#555; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:12px; }
        .campo { margin-bottom:12px; }
        .campo:last-child { margin-bottom:0; }
        .campo label { display:block; font-size:10px; font-weight:700; color:#555; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:5px; }
        .campo input { width:100%; height:42px; background:#1a1a1e; border:1px solid #2a2a30; border-radius:var(--sb-radius); padding:0 12px; color:#fff; font-size:13px; font-family:var(--font); outline:none; transition:0.15s; }
        .campo input:focus { border-color:#444; }

        /* ── PRODUTO SELECIONADO ── */
        .prod-sel { display:flex; align-items:center; gap:10px; background:#1a1a1e; border:1px solid #333; border-radius:8px; padding:10px 12px; margin-top:8px; }
        .prod-img-sm { width:36px; height:36px; border-radius:6px; object-fit:contain; background:#111; flex-shrink:0; }
        .prod-img-ph { width:36px; height:36px; border-radius:6px; background:#111; display:flex; align-items:center; justify-content:center; color:#333; flex-shrink:0; }
        .prod-cod { font-size:10px; color:#555; font-family:var(--mono); }
        .prod-nome { font-size:12px; color:#e0e0e0; font-weight:600; }

        /* ── TAMANHOS ── */
        .cx-grid { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
        .cx-tag { display:flex; align-items:center; gap:4px; background:#1a1a1e; border:1px solid #333; border-radius:20px; padding:5px 10px; font-size:11px; color:#888; font-family:var(--mono); }
        .cx-tag.on { background:rgba(255,255,255,0.08); border-color:#555; color:#fff; }
        .cx-tag button { background:none; border:none; color:#444; cursor:pointer; font-size:12px; line-height:1; padding:0; transition:0.15s; }
        .cx-tag button:hover { color:#ff6060; }
        .cx-add-row { display:flex; gap:6px; }
        .cx-add-row input { width:90px; height:34px; background:#1a1a1e; border:1px solid #2a2a30; border-radius:6px; padding:0 8px; color:#fff; font-size:12px; font-family:var(--mono); outline:none; }
        .cx-add-btn { height:34px; padding:0 12px; background:transparent; border:1px solid #333; color:#888; border-radius:6px; font-size:11px; font-family:var(--font); cursor:pointer; transition:0.15s; white-space:nowrap; }
        .cx-add-btn:hover { border-color:#555; color:#fff; }

        /* ── AUTOCOMPLETE ── */
        .busca-wrap { position:relative; }
        .ac-list { position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:200; background:#0e0e10; border:1px solid #333; border-radius:8px; max-height:200px; overflow-y:auto; }
        .ac-item { display:flex; align-items:center; gap:8px; padding:8px 12px; cursor:pointer; border-bottom:1px solid #1e1e22; }
        .ac-item:last-child { border-bottom:none; }
        .ac-item:hover { background:rgba(255,255,255,0.04); }
        .ac-img-s { width:28px; height:28px; border-radius:4px; object-fit:contain; background:#1e1e22; flex-shrink:0; }
        .ac-img-ph-s { width:28px; height:28px; border-radius:4px; background:#1e1e22; border:1px dashed #333; display:flex; align-items:center; justify-content:center; color:#444; flex-shrink:0; }

        /* ── FILA ── */
        .fila-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
        .fila-titulo { font-size:13px; font-weight:700; color:#fff; }
        .fila-count { font-size:11px; color:#555; font-family:var(--mono); }
        .fila-empty { text-align:center; padding:40px 20px; color:#333; font-size:12px; border:1px dashed #1e1e22; border-radius:10px; }
        .etiquetas-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px; }

        /* ── ETIQUETA ── */
        .etiqueta-wrap { position:relative; }
        .etiqueta-remove { position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; background:#ff4040; border:none; color:#fff; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:10; transition:0.15s; }
        .etiqueta-remove:hover { background:#ff2020; }
        .etiqueta-card { background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.5); font-family:'DM Sans',sans-serif; }
        .etiqueta-header-card { background:#000; padding:6px 10px; display:flex; align-items:center; gap:6px; }
        .etiqueta-logo { width:22px; height:22px; border-radius:3px; object-fit:contain; }
        .etiqueta-empresa { font-size:9px; font-weight:700; color:#fff; letter-spacing:0.5px; }
        .etiqueta-body { padding:10px; display:flex; gap:8px; align-items:flex-start; }
        .etiqueta-qr img { display:block; width:90px; height:90px; }
        .etiqueta-info { flex:1; min-width:0; }
        .etiqueta-cod { font-size:8px; font-weight:700; color:#888; font-family:monospace; }
        .etiqueta-nome { font-size:9px; font-weight:700; color:#000; margin:2px 0; line-height:1.3; }
        .etiqueta-cx { font-size:20px; font-weight:800; color:#000; font-family:monospace; line-height:1; }
        .etiqueta-un { font-size:8px; color:#666; }
        .etiqueta-cat { font-size:7px; color:#aaa; text-transform:uppercase; letter-spacing:0.5px; margin-top:4px; }
        .etiqueta-footer { background:#f5f5f5; padding:4px 10px; font-size:7px; color:#999; text-align:center; letter-spacing:0.3px; }

        /* ── VIDEO HINT ── */
        .video-hint { font-size:10px; margin-top:3px; }

        /* ── PRINT ── */
        @media print {
            body { background:#fff !important; }
            .page-header, .config-panel, .fila-header .btn-primary, .etiqueta-remove { display:none !important; }
            .layout { grid-template-columns:1fr; }
            .etiquetas-grid { grid-template-columns:repeat(4, 1fr); gap:6mm; padding:8mm; }
            .etiqueta-card { box-shadow:none; border:1px solid #eee; page-break-inside:avoid; }
            .page-container { padding:0; max-width:100%; }
            .fila-header { display:none !important; }
        }

        /* ── MOBILE ── */
        @media (max-width: 768px) {
            .layout { grid-template-columns:1fr; }
            .etiquetas-grid { grid-template-columns:repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="page-container">
    <div class="page-header">
        <div>
            <h1>Etiquetas QR</h1>
            <span class="sub">Magic Fireworks — Gerador de QR Codes</span>
        </div>
        <a href="/" class="btn-ghost"><i data-lucide="arrow-left"></i> Início</a>
    </div>

    <div class="layout">
        <!-- ── CONFIGURADOR ── -->
        <div class="config-panel">

            <!-- Produto -->
            <div class="card">
                <div class="card-title">Produto</div>
                <div class="campo busca-wrap">
                    <label>Buscar</label>
                    <input type="text" id="buscaInput" placeholder="Código ou nome..." autocomplete="off" oninput="buscarProduto(this.value)">
                    <div class="ac-list" id="acList" style="display:none;"></div>
                </div>
                <div id="prodSel" style="display:none;" class="prod-sel">
                    <div id="prodImgWrap" class="prod-img-ph"><i data-lucide="box"></i></div>
                    <div style="flex:1;">
                        <div class="prod-cod" id="prodCod"></div>
                        <div class="prod-nome" id="prodNome"></div>
                    </div>
                    <button onclick="limparProduto()" style="background:none;border:none;color:#444;cursor:pointer;"><i data-lucide="x"></i></button>
                </div>
            </div>

            <!-- Vídeo -->
            <div class="card" id="cardVideo" style="display:none;">
                <div class="card-title">Vídeo YouTube (opcional)</div>
                <div class="campo">
                    <label>ID ou URL</label>
                    <input type="text" id="videoInput" placeholder="Ex: dQw4w9WgXcQ" oninput="atualizarVideoHint()">
                    <div class="video-hint" id="videoHint"></div>
                </div>
                <button class="btn-ghost" onclick="salvarVideo()" style="width:100%;justify-content:center;margin-top:4px;">
                    <i data-lucide="save"></i> Salvar no produto
                </button>
            </div>

            <!-- Tamanhos -->
            <div class="card" id="cardCx" style="display:none;">
                <div class="card-title">Tamanhos de caixa (CX)</div>
                <div class="cx-grid" id="cxGrid"></div>
                <div class="cx-add-row">
                    <input type="number" id="cxCustom" placeholder="Ex: 400" min="1">
                    <button class="cx-add-btn" onclick="adicionarCx()"><i data-lucide="plus"></i> Adicionar</button>
                </div>
            </div>

            <!-- Adicionar à fila -->
            <button class="btn-add" id="btnAdd" onclick="adicionarAFila()" style="display:none;" disabled>
                <i data-lucide="plus-circle"></i> Adicionar à fila de impressão
            </button>

        </div>

        <!-- ── FILA ── -->
        <div>
            <div class="fila-header">
                <div>
                    <span class="fila-titulo">Fila de impressão</span>
                    <span class="fila-count" id="filaCount"> · 0 etiquetas</span>
                </div>
                <button class="btn-primary" id="btnPrint" onclick="window.print()" style="display:none;">
                    <i data-lucide="printer"></i> Imprimir tudo
                </button>
            </div>
            <div id="filaEmpty" class="fila-empty">
                <i data-lucide="qr-code" style="width:36px;height:36px;opacity:0.2;display:block;margin:0 auto 10px;"></i>
                Selecione um produto e adicione à fila para ver as etiquetas aqui
            </div>
            <div class="etiquetas-grid" id="etiquetasGrid"></div>
        </div>
    </div>
</div>

<script>
const BASE_URL = 'https://manager.magicfireworks.com.br';

let produtoAtual = null;
let cxSelecionados = [];
let fila = []; // [{ produto, cx, dataUrl }]
let buscaTimer = null;

document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
document.addEventListener('click', e => {
    if (!e.target.closest('.busca-wrap')) document.getElementById('acList').style.display = 'none';
});

// ── BUSCA ──
async function buscarProduto(q) {
    clearTimeout(buscaTimer);
    const list = document.getElementById('acList');
    if (!q || q.length < 2) { list.style.display = 'none'; return; }
    buscaTimer = setTimeout(async () => {
        const res = await fetch(`/api/catalogo/buscar?q=${encodeURIComponent(q)}`);
        const json = await res.json();
        if (!json.success || !json.data.length) {
            list.innerHTML = '<div style="padding:10px;color:#444;font-size:11px;text-align:center;">Nenhum produto</div>';
            list.style.display = 'block'; return;
        }
        list.innerHTML = json.data.map(p => {
            const img = p.imagem
                ? `<img class="ac-img-s" src="/data/produtos/${esc(p.imagem)}" onerror="this.style.display='none'">`
                : `<div class="ac-img-ph-s"><i data-lucide="box"></i></div>`;
            return `<div class="ac-item" onclick="selecionarProduto(${JSON.stringify(p).replace(/"/g,'&quot;')})">
                ${img}<div><div style="font-size:9px;color:#555;font-family:monospace;">${esc(p.codigo)}</div><div style="font-size:12px;color:#ddd;">${esc(p.nome)}</div></div>
            </div>`;
        }).join('');
        list.style.display = 'block';
        lucide.createIcons();
    }, 200);
}

async function selecionarProduto(prod) {
    document.getElementById('acList').style.display = 'none';
    document.getElementById('buscaInput').value = '';

    // Busca dados completos incluindo video_id
    try {
        const res = await fetch('/api/catalogo/catalogo');
        const json = await res.json();
        const todos = Object.values(json.data || {}).flat();
        produtoAtual = todos.find(p => p.codigo === prod.codigo) || prod;
    } catch { produtoAtual = prod; }

    // Mostra produto selecionado
    const wrap = document.getElementById('prodImgWrap');
    if (produtoAtual.imagem) {
        wrap.outerHTML = `<img id="prodImgWrap" class="prod-img-sm" src="/data/produtos/${esc(produtoAtual.imagem)}" onerror="this.style.display='none'">`;
    }
    document.getElementById('prodCod').textContent = produtoAtual.codigo;
    document.getElementById('prodNome').textContent = produtoAtual.nome;
    document.getElementById('prodSel').style.display = 'flex';

    // Vídeo
    document.getElementById('cardVideo').style.display = '';
    if (produtoAtual.video_id) document.getElementById('videoInput').value = produtoAtual.video_id;
    atualizarVideoHint();

    // Tamanhos padrão
    const fator = produtoAtual.fator || 1;
    cxSelecionados = [];
    if (fator >= 100) cxSelecionados.push(100);
    if (fator >= 400) cxSelecionados.push(400);
    if (!cxSelecionados.length) cxSelecionados.push(fator > 1 ? fator : 1);
    renderCx();
    document.getElementById('cardCx').style.display = '';

    // Habilita botão adicionar
    document.getElementById('btnAdd').style.display = '';
    atualizarBtnAdd();

    lucide.createIcons();
}

function limparProduto() {
    produtoAtual = null; cxSelecionados = [];
    document.getElementById('prodSel').style.display = 'none';
    document.getElementById('cardVideo').style.display = 'none';
    document.getElementById('cardCx').style.display = 'none';
    document.getElementById('btnAdd').style.display = 'none';
    document.getElementById('videoInput').value = '';
    document.getElementById('videoHint').textContent = '';
}

// ── VÍDEO ──
function extrairVideoId(v) {
    if (!v) return '';
    const m = v.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : (v.length === 11 && /^[a-zA-Z0-9_-]+$/.test(v) ? v : '');
}
function atualizarVideoHint() {
    const val = document.getElementById('videoInput').value.trim();
    const id = extrairVideoId(val);
    const el = document.getElementById('videoHint');
    if (id) { el.textContent = `✓ ID: ${id}`; el.style.color = '#4cd964'; }
    else if (val) { el.textContent = 'URL ou ID inválido'; el.style.color = '#ff6060'; }
    else { el.textContent = ''; }
}
async function salvarVideo() {
    if (!produtoAtual) return;
    const id = extrairVideoId(document.getElementById('videoInput').value.trim());
    try {
        const res = await fetch(`/api/catalogo/item/${produtoAtual.id}`, {
            method: 'PUT', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ video_id: id })
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        produtoAtual.video_id = id;
        alert(id ? `Vídeo ${id} salvo!` : 'Vídeo removido.');
    } catch (err) { alert('Erro: ' + err.message); }
}

// ── TAMANHOS ──
function renderCx() {
    const grid = document.getElementById('cxGrid');
    grid.innerHTML = cxSelecionados.map((cx, i) => `
        <div class="cx-tag on">CX ${cx}
            <button onclick="removerCx(${i})"><i data-lucide="x"></i></button>
        </div>`).join('');
    lucide.createIcons();
    atualizarBtnAdd();
}
function adicionarCx() {
    const val = parseInt(document.getElementById('cxCustom').value);
    if (!val || val < 1 || cxSelecionados.includes(val)) return;
    cxSelecionados.push(val); cxSelecionados.sort((a,b)=>a-b);
    renderCx(); document.getElementById('cxCustom').value = '';
}
function removerCx(idx) { cxSelecionados.splice(idx,1); renderCx(); }

function atualizarBtnAdd() {
    const btn = document.getElementById('btnAdd');
    if (btn) btn.disabled = !produtoAtual || cxSelecionados.length === 0;
}

// ── FILA ──
function adicionarAFila() {
    if (!produtoAtual || !cxSelecionados.length) return;
    const btn = document.getElementById('btnAdd');

    for (const cx of cxSelecionados) {
        const url = `${BASE_URL}/p?sku=${encodeURIComponent(produtoAtual.codigo)}&cx=${cx}`;
        const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&format=png&data=${encodeURIComponent(url)}`;
        fila.push({ produto: { ...produtoAtual }, cx, qrSrc, url });
    }

    renderFila();
    lucide.createIcons();
}

function removerDaFila(idx) {
    fila.splice(idx, 1);
    renderFila();
}

function renderFila() {
    const grid = document.getElementById('etiquetasGrid');
    const empty = document.getElementById('filaEmpty');
    const btnPrint = document.getElementById('btnPrint');
    const count = document.getElementById('filaCount');

    count.textContent = ` · ${fila.length} etiqueta${fila.length !== 1 ? 's' : ''}`;

    if (fila.length === 0) {
        empty.style.display = '';
        grid.innerHTML = '';
        btnPrint.style.display = 'none';
        return;
    }

    empty.style.display = 'none';
    btnPrint.style.display = '';

    grid.innerHTML = fila.map((item, i) => `
        <div class="etiqueta-wrap">
            <button class="etiqueta-remove" onclick="removerDaFila(${i})" title="Remover">✕</button>
            <div class="etiqueta-card">
                <div class="etiqueta-header-card">
                    <img src="/public/MagicFireworksLogo.jpeg" class="etiqueta-logo">
                    <span class="etiqueta-empresa">MAGIC FIREWORKS</span>
                </div>
                <div class="etiqueta-body">
                    <div class="etiqueta-qr">
                        <img src="${item.qrSrc}" style="width:90px;height:90px;display:block;" loading="eager">
                    </div>
                    <div class="etiqueta-info">
                        <div class="etiqueta-cod">${esc(item.produto.codigo)}</div>
                        <div class="etiqueta-nome">${esc(item.produto.nome)}</div>
                        <div class="etiqueta-cx">${item.cx}</div>
                        <div class="etiqueta-un">UN por caixa</div>
                        <div class="etiqueta-cat">${esc(item.produto.categoria || '')}</div>
                    </div>
                </div>
                <div class="etiqueta-footer">manager.magicfireworks.com.br</div>
            </div>
        </div>
    `).join('');
}

function esc(s) {
    if (!s) return '';
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}
</script>
</body>
</html>
