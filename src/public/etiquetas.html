<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas QR — MF Manager</title>
    <link rel="icon" type="image/jpeg" href="/public/MagicFireworksLogo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        body { overflow: auto; background: #050505; }

        .page-container { max-width: 900px; margin: 0 auto; padding: 32px 20px 60px; }

        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 28px; gap: 12px; flex-wrap: wrap;
        }
        .page-header h1 { font-size: 22px; font-weight: 700; color: #fff; }
        .page-header .sub { font-size: 10px; color: var(--sb-text-dim); font-weight: 600;
            text-transform: uppercase; letter-spacing: 1.2px; margin-top: 4px; display: block; }

        .btn-back {
            background: transparent; border: 1px solid #333; color: #888;
            padding: 9px 16px; border-radius: var(--sb-radius); font-size: 13px;
            cursor: pointer; text-decoration: none; transition: 0.15s; font-family: var(--font);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-back:hover { border-color: #555; color: #fff; }

        .btn-primary {
            background: #fff; border: none; color: #000; padding: 9px 20px;
            border-radius: var(--sb-radius); font-size: 13px; font-weight: 700;
            cursor: pointer; transition: 0.15s; font-family: var(--font);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary:hover { background: #e0e0e0; }

        /* ── CONFIGURADOR ── */
        .config-card {
            background: #121214; border: 1px solid #29292e;
            border-radius: 12px; padding: 20px; margin-bottom: 16px;
        }
        .config-section-title {
            font-size: 10px; font-weight: 700; color: #555;
            text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px;
        }
        .campo { margin-bottom: 14px; }
        .campo:last-child { margin-bottom: 0; }
        .campo label {
            display: block; font-size: 10px; font-weight: 700; color: #555;
            text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px;
        }
        .campo input {
            width: 100%; height: 42px; background: #1a1a1e; border: 1px solid #2a2a30;
            border-radius: var(--sb-radius); padding: 0 12px; color: #fff;
            font-size: 14px; font-family: var(--font); outline: none; transition: 0.15s;
        }
        .campo input:focus { border-color: #444; }

        /* ── PRODUTO SELECIONADO ── */
        .produto-selecionado {
            display: flex; align-items: center; gap: 12px;
            background: #1a1a1e; border: 1px solid #333; border-radius: 8px;
            padding: 10px 14px; margin-top: 8px;
        }
        .prod-img { width: 40px; height: 40px; border-radius: 6px; object-fit: contain; background: #111; flex-shrink: 0; }
        .prod-img-ph { width: 40px; height: 40px; border-radius: 6px; background: #111; display: flex; align-items: center; justify-content: center; color: #333; flex-shrink: 0; }
        .prod-info { flex: 1; }
        .prod-cod { font-size: 10px; color: #555; font-family: var(--mono); }
        .prod-nome { font-size: 13px; color: #e0e0e0; font-weight: 600; }
        .prod-video { font-size: 11px; color: #4cd964; margin-top: 2px; }
        .prod-video.sem { color: #555; }

        /* ── TAMANHOS DE CAIXA ── */
        .cx-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .cx-chip {
            display: flex; align-items: center; gap: 6px;
            background: #1a1a1e; border: 1px solid #2a2a30; border-radius: 20px;
            padding: 6px 12px; font-size: 12px; color: #888; font-family: var(--mono);
        }
        .cx-chip.ativo { background: rgba(255,255,255,0.08); border-color: #555; color: #fff; }
        .cx-chip button {
            background: none; border: none; color: #444; cursor: pointer;
            font-size: 14px; line-height: 1; padding: 0; transition: 0.15s;
        }
        .cx-chip button:hover { color: #ff6060; }
        .cx-add-row { display: flex; gap: 8px; }
        .cx-add-row input {
            width: 100px; height: 36px; background: #1a1a1e; border: 1px solid #2a2a30;
            border-radius: 6px; padding: 0 10px; color: #fff; font-size: 13px;
            font-family: var(--mono); outline: none;
        }
        .cx-add-btn {
            height: 36px; padding: 0 14px; background: transparent; border: 1px solid #333;
            color: #888; border-radius: 6px; font-size: 12px; font-family: var(--font);
            cursor: pointer; transition: 0.15s; white-space: nowrap;
        }
        .cx-add-btn:hover { border-color: #555; color: #fff; }

        /* ── AUTOCOMPLETE ── */
        .busca-wrap { position: relative; }
        .ac-list {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 100;
            background: #0e0e10; border: 1px solid #333; border-radius: 8px;
            max-height: 200px; overflow-y: auto;
        }
        .ac-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            cursor: pointer; border-bottom: 1px solid #1e1e22;
        }
        .ac-item:last-child { border-bottom: none; }
        .ac-item:hover { background: rgba(255,255,255,0.04); }
        .ac-img-sm { width: 32px; height: 32px; border-radius: 4px; object-fit: contain; background: #1e1e22; flex-shrink: 0; }
        .ac-img-ph-sm { width: 32px; height: 32px; border-radius: 4px; background: #1e1e22; border: 1px dashed #333; display: flex; align-items: center; justify-content: center; color: #444; flex-shrink: 0; }
        .ac-cod { font-size: 10px; color: #555; font-family: var(--mono); }
        .ac-nome { font-size: 13px; color: #ddd; }

        /* ── ETIQUETAS GERADAS ── */
        .etiquetas-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px; margin-top: 20px;
        }

        .etiqueta-card {
            background: #fff; border-radius: 10px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            font-family: 'DM Sans', sans-serif;
        }

        .etiqueta-header-card {
            background: #000; padding: 8px 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .etiqueta-logo { width: 28px; height: 28px; border-radius: 4px; object-fit: contain; }
        .etiqueta-empresa { font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }

        .etiqueta-body {
            padding: 12px; display: flex; gap: 12px; align-items: flex-start;
        }
        .etiqueta-qr canvas, .etiqueta-qr img { display: block; }

        .etiqueta-info { flex: 1; min-width: 0; }
        .etiqueta-cod { font-size: 10px; font-weight: 700; color: #888; font-family: monospace; }
        .etiqueta-nome { font-size: 12px; font-weight: 700; color: #000; margin: 2px 0; line-height: 1.3; }
        .etiqueta-cx { font-size: 18px; font-weight: 800; color: #000; font-family: monospace; }
        .etiqueta-un { font-size: 10px; color: #666; }
        .etiqueta-cat { font-size: 9px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px; }

        .etiqueta-footer {
            background: #f5f5f5; padding: 5px 12px;
            font-size: 9px; color: #888; text-align: center; letter-spacing: 0.3px;
        }

        /* ── PRINT ── */
        @media print {
            body { background: #fff !important; }
            .page-header, .config-card, .acoes-bar { display: none !important; }
            .etiquetas-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8mm;
                margin: 0;
                padding: 10mm;
            }
            .etiqueta-card { box-shadow: none; border: 1px solid #ddd; }
            .page-container { padding: 0; max-width: 100%; }
        }

        /* ── ACOES BAR ── */
        .acoes-bar {
            display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap;
        }

        /* ── EMPTY ── */
        .empty-msg {
            text-align: center; padding: 40px 20px; color: #444; font-size: 13px;
            border: 1px dashed #222; border-radius: 10px; margin-top: 16px;
        }

        /* ── VIDEO HELPER ── */
        .video-hint {
            font-size: 10px; color: #444; margin-top: 4px;
        }

        @media (max-width: 768px) {
            .page-container { padding: 20px 16px 60px; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .etiquetas-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="page-container">

    <div class="page-header">
        <div>
            <h1>Gerador de Etiquetas</h1>
            <span class="sub">MF Manager — Magic Fireworks</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <a href="/" class="btn-back"><i data-lucide="arrow-left"></i> Início</a>
        </div>
    </div>

    <!-- CONFIG: PRODUTO -->
    <div class="config-card">
        <div class="config-section-title">1. Selecionar produto</div>
        <div class="campo busca-wrap">
            <label>Buscar produto</label>
            <input type="text" id="buscaProduto" placeholder="Digite o código ou nome..." autocomplete="off" oninput="buscarProduto(this.value)">
            <div class="ac-list" id="acList" style="display:none;"></div>
        </div>
        <div id="produtoSelecionado" style="display:none;" class="produto-selecionado">
            <div class="prod-img-ph" id="prodImgWrap"><i data-lucide="box"></i></div>
            <div class="prod-info">
                <div class="prod-cod" id="prodCod"></div>
                <div class="prod-nome" id="prodNome"></div>
                <div class="prod-video sem" id="prodVideo">Sem vídeo vinculado</div>
            </div>
            <button onclick="limparProduto()" style="background:none;border:none;color:#444;cursor:pointer;">
                <i data-lucide="x"></i>
            </button>
        </div>
    </div>

    <!-- CONFIG: VÍDEO -->
    <div class="config-card" id="cardVideo" style="display:none;">
        <div class="config-section-title">2. Vídeo do YouTube (opcional)</div>
        <div class="campo">
            <label>ID ou URL do vídeo</label>
            <input type="text" id="videoInput" placeholder="Ex: dQw4w9WgXcQ ou https://youtube.com/watch?v=..."
                   oninput="atualizarVideo()">
            <div class="video-hint" id="videoHint"></div>
        </div>
        <button class="btn-back" onclick="salvarVideo()" style="margin-top:4px;">
            <i data-lucide="save"></i> Salvar vídeo no produto
        </button>
    </div>

    <!-- CONFIG: TAMANHOS -->
    <div class="config-card" id="cardTamanhos" style="display:none;">
        <div class="config-section-title">3. Tamanhos de caixa</div>
        <div class="cx-grid" id="cxGrid"></div>
        <div class="cx-add-row">
            <input type="number" id="cxCustom" placeholder="Ex: 400" min="1">
            <button class="cx-add-btn" onclick="adicionarCx()">
                <i data-lucide="plus"></i> Adicionar tamanho
            </button>
        </div>
    </div>

    <!-- GERAR -->
    <div id="cardGerar" style="display:none;">
        <button class="btn-primary" onclick="gerarEtiquetas()" style="width:100%;justify-content:center;height:48px;font-size:14px;">
            <i data-lucide="qr-code"></i> Gerar QR Codes
        </button>
    </div>

    <!-- RESULTADO -->
    <div id="resultadoArea">
        <div class="empty-msg" id="emptyMsg">
            <i data-lucide="qr-code" style="width:40px;height:40px;opacity:0.2;display:block;margin:0 auto 12px;"></i>
            Selecione um produto para começar
        </div>
        <div class="etiquetas-grid" id="etiquetasGrid" style="display:none;"></div>
        <div class="acoes-bar" id="acoesBar" style="display:none;">
            <button class="btn-primary" onclick="window.print()">
                <i data-lucide="printer"></i> Imprimir / Exportar PDF
            </button>
        </div>
    </div>

</div>

<script>
const BASE_URL = 'https://manager.magicfireworks.com.br';

let produtoAtual = null;
let cxSelecionados = [];
let buscaTimer = null;

document.addEventListener('DOMContentLoaded', () => lucide.createIcons());

document.addEventListener('click', e => {
    if (!e.target.closest('.busca-wrap')) document.getElementById('acList').style.display = 'none';
});

// ── BUSCA DE PRODUTO ──
async function buscarProduto(q) {
    clearTimeout(buscaTimer);
    const list = document.getElementById('acList');
    if (!q || q.length < 2) { list.style.display = 'none'; return; }
    buscaTimer = setTimeout(async () => {
        const res = await fetch(`/api/catalogo/buscar?q=${encodeURIComponent(q)}`);
        const json = await res.json();
        if (!json.success || !json.data.length) {
            list.innerHTML = '<div style="padding:12px;color:#444;font-size:12px;text-align:center;">Nenhum produto</div>';
            list.style.display = 'block';
            return;
        }
        list.innerHTML = json.data.map(p => {
            const img = p.imagem
                ? `<img class="ac-img-sm" src="/data/produtos/${esc(p.imagem)}" onerror="this.style.display='none'">`
                : `<div class="ac-img-ph-sm"><i data-lucide="box"></i></div>`;
            return `<div class="ac-item" onclick="selecionarProduto(${JSON.stringify(p).replace(/"/g,'&quot;')})">
                ${img}
                <div>
                    <div class="ac-cod">${esc(p.codigo)}</div>
                    <div class="ac-nome">${esc(p.nome)}</div>
                </div>
            </div>`;
        }).join('');
        list.style.display = 'block';
        lucide.createIcons();
    }, 200);
}

async function selecionarProduto(prod) {
    // Busca dados completos do produto (inclui video_id)
    try {
        const res = await fetch('/api/catalogo/catalogo');
        const json = await res.json();
        const todos = Object.values(json.data || {}).flat();
        const completo = todos.find(p => p.codigo === prod.codigo) || prod;
        produtoAtual = completo;
    } catch {
        produtoAtual = prod;
    }

    document.getElementById('acList').style.display = 'none';
    document.getElementById('buscaProduto').value = '';

    // Atualiza display do produto selecionado
    const wrap = document.getElementById('prodImgWrap');
    if (produtoAtual.imagem) {
        wrap.innerHTML = `<img class="prod-img" src="/data/produtos/${esc(produtoAtual.imagem)}" onerror="this.innerHTML='<i data-lucide=\\'box\\'></i>'">`;
    }
    document.getElementById('prodCod').textContent = produtoAtual.codigo;
    document.getElementById('prodNome').textContent = produtoAtual.nome;
    const videoEl = document.getElementById('prodVideo');
    if (produtoAtual.video_id) {
        videoEl.textContent = `🎬 Vídeo: ${produtoAtual.video_id}`;
        videoEl.classList.remove('sem');
    } else {
        videoEl.textContent = 'Sem vídeo vinculado';
        videoEl.classList.add('sem');
    }
    document.getElementById('produtoSelecionado').style.display = 'flex';

    // Vídeo
    document.getElementById('cardVideo').style.display = '';
    if (produtoAtual.video_id) document.getElementById('videoInput').value = produtoAtual.video_id;
    atualizarVideo();

    // Tamanhos padrão baseados no fator
    const fator = produtoAtual.fator || 1;
    cxSelecionados = [];
    if (fator >= 100) cxSelecionados.push(100);
    if (fator >= 400) cxSelecionados.push(400);
    if (!cxSelecionados.length) cxSelecionados.push(fator > 1 ? fator : 1);
    renderCx();

    document.getElementById('cardTamanhos').style.display = '';
    document.getElementById('cardGerar').style.display = '';
    document.getElementById('emptyMsg').style.display = 'none';

    lucide.createIcons();
}

function limparProduto() {
    produtoAtual = null;
    cxSelecionados = [];
    document.getElementById('produtoSelecionado').style.display = 'none';
    document.getElementById('cardVideo').style.display = 'none';
    document.getElementById('cardTamanhos').style.display = 'none';
    document.getElementById('cardGerar').style.display = 'none';
    document.getElementById('etiquetasGrid').style.display = 'none';
    document.getElementById('acoesBar').style.display = 'none';
    document.getElementById('emptyMsg').style.display = '';
    document.getElementById('videoInput').value = '';
}

// ── VÍDEO ──
function extrairVideoId(input) {
    if (!input) return '';
    const m = input.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : (input.length === 11 ? input : '');
}

function atualizarVideo() {
    const val = document.getElementById('videoInput').value.trim();
    const id = extrairVideoId(val);
    const hint = document.getElementById('videoHint');
    if (id) {
        hint.textContent = `ID identificado: ${id}`;
        hint.style.color = '#4cd964';
    } else if (val) {
        hint.textContent = 'URL ou ID inválido';
        hint.style.color = '#ff6060';
    } else {
        hint.textContent = '';
    }
}

async function salvarVideo() {
    if (!produtoAtual) return;
    const val = document.getElementById('videoInput').value.trim();
    const videoId = extrairVideoId(val);
    try {
        const res = await fetch(`/api/catalogo/item/${produtoAtual.id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ video_id: videoId })
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        produtoAtual.video_id = videoId;
        const videoEl = document.getElementById('prodVideo');
        if (videoId) {
            videoEl.textContent = `🎬 Vídeo: ${videoId}`;
            videoEl.classList.remove('sem');
        } else {
            videoEl.textContent = 'Sem vídeo vinculado';
            videoEl.classList.add('sem');
        }
        alert('Vídeo salvo no produto!');
    } catch (err) {
        alert('Erro: ' + err.message);
    }
}

// ── TAMANHOS CX ──
function renderCx() {
    const grid = document.getElementById('cxGrid');
    grid.innerHTML = cxSelecionados.map((cx, i) => `
        <div class="cx-chip ativo">
            CX ${cx}
            <button onclick="removerCx(${i})"><i data-lucide="x"></i></button>
        </div>
    `).join('');
    lucide.createIcons();
}

function adicionarCx() {
    const input = document.getElementById('cxCustom');
    const val = parseInt(input.value);
    if (!val || val < 1) return;
    if (!cxSelecionados.includes(val)) {
        cxSelecionados.push(val);
        cxSelecionados.sort((a, b) => a - b);
        renderCx();
    }
    input.value = '';
}

function removerCx(idx) {
    cxSelecionados.splice(idx, 1);
    renderCx();
}

// ── GERAR ETIQUETAS ──
async function gerarEtiquetas() {
    if (!produtoAtual || !cxSelecionados.length) return;

    const grid = document.getElementById('etiquetasGrid');
    grid.innerHTML = '';
    grid.style.display = 'grid';
    document.getElementById('acoesBar').style.display = 'flex';

    for (const cx of cxSelecionados) {
        const url = `${BASE_URL}/p?sku=${encodeURIComponent(produtoAtual.codigo)}&cx=${cx}`;
        const card = document.createElement('div');
        card.className = 'etiqueta-card';

        const imgHtml = produtoAtual.imagem
            ? `<img src="/data/produtos/${esc(produtoAtual.imagem)}" style="width:36px;height:36px;object-fit:contain;border-radius:4px;background:#111;">`
            : '';

        card.innerHTML = `
            <div class="etiqueta-header-card">
                <img src="/public/MagicFireworksLogo.jpeg" class="etiqueta-logo">
                <span class="etiqueta-empresa">MAGIC FIREWORKS</span>
            </div>
            <div class="etiqueta-body">
                <div class="etiqueta-qr" id="qr_${produtoAtual.codigo}_${cx}"></div>
                <div class="etiqueta-info">
                    <div class="etiqueta-cod">${esc(produtoAtual.codigo)}</div>
                    <div class="etiqueta-nome">${esc(produtoAtual.nome)}</div>
                    <div class="etiqueta-cx">${cx} UN</div>
                    <div class="etiqueta-un">por caixa</div>
                    <div class="etiqueta-cat">${esc(produtoAtual.categoria || '')}</div>
                </div>
            </div>
            <div class="etiqueta-footer">
                manager.magicfireworks.com.br
            </div>
        `;
        grid.appendChild(card);

        // Gera QR Code
        await QRCode.toCanvas(
            document.createElement('canvas'),
            url,
            { width: 110, margin: 1, color: { dark: '#000000', light: '#ffffff' } },
            (err, canvas) => {
                if (!err) document.getElementById(`qr_${produtoAtual.codigo}_${cx}`).appendChild(canvas);
            }
        );
    }

    lucide.createIcons();
    document.getElementById('etiquetasGrid').scrollIntoView({ behavior: 'smooth' });
}

function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}
</script>
</body>
</html>
