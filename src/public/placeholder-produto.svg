  <line x1="60" y1="48" x2="35" y2="23"  stroke="#e94560" stroke-width="2"   stroke-linecap="round"/>

  <!-- Raios curtos (entre os longos) -->
  <line x1="60" y1="48" x2="74" y2="18"  stroke="#e67e22" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="60" y1="48" x2="93" y2="34"  stroke="#e67e22" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="60" y1="48" x2="93" y2="62"  stroke="#e67e22" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="60" y1="48" x2="74" y2="78"  stroke="#e67e22" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="60" y1="48" x2="46" y2="78"  stroke="#e67e22" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="60" y1="48" x2="27" y2="62"  stroke="#e67e22" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="60" y1="48" x2="27" y2="34"  stroke="#e67e22" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="60" y1="48" x2="46" y2="18"  stroke="#e67e22" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Pontas brilhantes nos raios longos -->
  <circle cx="60" cy="14" r="2.5" fill="#fff"    opacity="0.9"/>
  <circle cx="85" cy="23" r="2.2" fill="#fff"    opacity="0.85"/>
  <circle cx="96" cy="48" r="2.2" fill="#fff"    opacity="0.85"/>
  <circle cx="85" cy="73" r="2.2" fill="#fff"    opacity="0.85"/>
  <circle cx="35" cy="73" r="2.2" fill="#fff"    opacity="0.85"/>
  <circle cx="24" cy="48" r="2.2" fill="#fff"    opacity="0.85"/>
  <circle cx="35" cy="23" r="2.2" fill="#fff"    opacity="0.85"/>

  <!-- Pontas nos raios curtos -->
  <circle cx="74" cy="18" r="1.8" fill="#ffd700" opacity="0.8"/>
  <circle cx="93" cy="34" r="1.8" fill="#ffd700" opacity="0.8"/>
  <circle cx="93" cy="62" r="1.8" fill="#ffd700" opacity="0.8"/>
  <circle cx="74" cy="78" r="1.8" fill="#ffd700" opacity="0.8"/>
  <circle cx="46" cy="78" r="1.8" fill="#ffd700" opacity="0.8"/>
  <circle cx="27" cy="62" r="1.8" fill="#ffd700" opacity="0.8"/>
  <circle cx="27" cy="34" r="1.8" fill="#ffd700" opacity="0.8"/>
  <circle cx="46" cy="18" r="1.8" fill="#ffd700" opacity="0.8"/>

  <!-- Núcleo central -->
  <circle cx="60" cy="48" r="5" fill="#fff" opacity="0.95"/>
  <circle cx="60" cy="48" r="3" fill="#e94560"/>

