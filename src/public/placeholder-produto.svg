<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">

  <!-- Haste do foguete -->
  <line x1="60" y1="110" x2="60" y2="72" stroke="#555" stroke-width="2" stroke-linecap="round"/>

  <!-- Rastro do foguete -->
  <line x1="60" y1="110" x2="52" y2="118" stroke="#888" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="60" y1="110" x2="68" y2="118" stroke="#888" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Explosão central — raios em leque -->
  <!-- Raios longos (alternados) -->
  <line x1="60" y1="48" x2="60" y2="14"  stroke="#e94560" stroke-width="2"   stroke-linecap="round"/>
  <line x1="60" y1="48" x2="85" y2="23"  stroke="#e94560" stroke-width="2"   stroke-linecap="round"/>
  <line x1="60" y1="48" x2="96" y2="48"  stroke="#e94560" stroke-width="2"   stroke-linecap="round"/>
  <line x1="60" y1="48" x2="85" y2="73"  stroke="#e94560" stroke-width="2"   stroke-linecap="round"/>
  <line x1="60" y1="48" x2="35" y2="73"  stroke="#e94560" stroke-width="2"   stroke-linecap="round"/>
