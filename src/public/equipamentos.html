<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipamentos - Magic Fireworks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/app.css">
    <style>
        body { overflow: auto; }
        .page-container { max-width: 1200px; margin: 0 auto; padding: 40px 30px; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-header h1 { font-size: 24px; font-weight: 700; color: #fff; }
        .page-header .brand-sub { font-size: 11px; color: var(--sb-accent); font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; }
        .header-actions { display: flex; gap: 12px; align-items: center; }

        .btn-back { background: transparent; border: 1px solid var(--sb-border); color: var(--sb-text-dim); padding: 10px 16px; border-radius: var(--sb-radius); font-size: 13px; cursor: pointer; text-decoration: none; transition: 0.2s; }
        .btn-back:hover { border-color: #555; color: #fff; }

        .btn-primary { background: var(--sb-accent); border: none; color: #fff; padding: 10px 20px; border-radius: var(--sb-radius); font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background: var(--sb-accent-hover); }

        .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; border: none; transition: 0.15s; }
        .btn-edit { background: rgba(255,255,255,0.08); color: #ccc; }
        .btn-edit:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .btn-delete { background: rgba(233,69,96,0.1); color: #e94560; }
        .btn-delete:hover { background: rgba(233,69,96,0.2); }
        .btn-save { background: rgba(46,204,113,0.15); color: #2ecc71; }
        .btn-save:hover { background: rgba(46,204,113,0.25); }
        .btn-cancel { background: rgba(255,255,255,0.05); color: #888; }
        .btn-cancel:hover { background: rgba(255,255,255,0.1); color: #ccc; }

        /* Toolbar */
        .toolbar { display: flex; gap: 12px; margin-bottom: 24px; align-items: center; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 200px; height: 42px; background: var(--sb-input-bg); border: 1px solid var(--sb-border); border-radius: var(--sb-radius); padding: 0 14px; color: #fff; font-size: 13px; outline: none; }
        .search-box:focus { border-color: var(--sb-accent); }
        .filter-select { height: 42px; background: var(--sb-input-bg); border: 1px solid var(--sb-border); border-radius: var(--sb-radius); padding: 0 14px; color: #fff; font-size: 13px; outline: none; min-width: 180px; }
        .stats { font-size: 12px; color: var(--sb-text-dim); margin-left: auto; }

        /* Tabela */
        .equip-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        .equip-table thead th {
            background: #1a1a1e; color: var(--sb-text-dim); font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 14px; text-align: left;
            border-bottom: 2px solid var(--sb-border); position: sticky; top: 0; z-index: 10;
        }
        .equip-table tbody td { padding: 10px 14px; border-bottom: 1px solid var(--sb-border); vertical-align: middle; }
        .equip-table tbody tr { transition: 0.15s; }
        .equip-table tbody tr:hover { background: rgba(255,255,255,0.03); }

        .td-sku { font-family: var(--mono); font-weight: 700; color: var(--sb-accent); font-size: 12px; white-space: nowrap; }
        .td-nome { color: #fff; font-weight: 500; }
        .td-cat { color: var(--sb-text-dim); font-size: 12px; }
        .td-qtd { font-family: var(--mono); font-weight: 600; text-align: center; }
        .td-manut { font-family: var(--mono); text-align: center; color: #e67e22; }
        .td-obs { color: #888; font-size: 11px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .td-actions { text-align: right; white-space: nowrap; display: flex; gap: 6px; justify-content: flex-end; }

        /* Categoria header */
        .cat-row td { background: rgba(233,69,96,0.06); font-weight: 700; font-size: 12px; color: var(--sb-accent); letter-spacing: 0.5px; text-transform: uppercase; padding: 8px 14px; border-bottom: 1px solid var(--sb-border); }
        .cat-count { font-weight: 400; color: var(--sb-text-dim); font-size: 11px; text-transform: none; letter-spacing: 0; margin-left: 8px; }

        /* Inline edit */
        .edit-input { background: var(--sb-input-bg); border: 1px solid var(--sb-border); border-radius: 4px; color: #fff; padding: 4px 8px; font-size: 12px; outline: none; width: 100%; }
        .edit-input:focus { border-color: var(--sb-accent); }
        .edit-input-sm { width: 60px; text-align: center; }

        /* Modal de adição */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--sb-bg); border: 1px solid var(--sb-border); border-radius: 10px; padding: 30px; width: 500px; max-width: 90vw; }
        .modal h2 { font-size: 18px; color: #fff; margin-bottom: 20px; }
        .modal-field { margin-bottom: 16px; }
        .modal-field label { display: block; font-size: 11px; font-weight: 700; color: var(--sb-text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .modal-input { width: 100%; height: 42px; background: var(--sb-input-bg); border: 1px solid var(--sb-border); border-radius: var(--sb-radius); padding: 0 14px; color: #fff; font-size: 13px; outline: none; }
        .modal-input:focus { border-color: var(--sb-accent); }
        .modal-row { display: flex; gap: 12px; }
        .modal-row .modal-field { flex: 1; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

        .empty-msg { text-align: center; padding: 60px 20px; color: #555; }
    </style>
</head>
<body>
<div class="page-container">
    <div class="page-header">
        <div>
            <h1>📦 Cadastro de Equipamentos</h1>
            <span class="brand-sub">Magic Fireworks — Controle de Estoque</span>
        </div>
        <div class="header-actions">
            <button class="btn-back" onclick="gerarInventarioPDF()" style="border-color: var(--sb-accent); color: var(--sb-accent);">📋 Inventário PDF</button>
            <a href="/" class="btn-back">← Voltar ao Recibo</a>
            <button class="btn-primary" onclick="abrirModalNovo()">+ Novo Equipamento</button>
        </div>
    </div>

    <div class="toolbar">
        <input type="text" class="search-box" id="searchBox" placeholder="Buscar por nome, SKU ou categoria..." oninput="filtrar()">
        <select class="filter-select" id="filterCategoria" onchange="filtrar()">
            <option value="">Todas as categorias</option>
        </select>
        <div class="stats" id="stats"></div>
    </div>

    <div id="tabelaContainer"></div>

    <!-- Modal: Novo Equipamento -->
    <div class="modal-overlay" id="modalNovo">
        <div class="modal">
            <h2 id="modalTitulo">Novo Equipamento</h2>
            <input type="hidden" id="modalEditId" value="">
            <div class="modal-row">
                <div class="modal-field">
                    <label>SKU</label>
                    <input type="text" class="modal-input" id="modalSku" placeholder="Ex: DMX-008" style="font-family: var(--mono);">
                </div>
                <div class="modal-field">
                    <label>Categoria</label>
                    <input type="text" class="modal-input" id="modalCategoria" placeholder="Ex: Cabos DMX" list="modalCatList">
                    <datalist id="modalCatList"></datalist>
                </div>
            </div>
            <div class="modal-field">
                <label>Nome</label>
                <input type="text" class="modal-input" id="modalNome" placeholder="Ex: Cabo DMX 100 Metros">
            </div>
            <div class="modal-row">
                <div class="modal-field">
                    <label>Quantidade</label>
                    <input type="number" class="modal-input" id="modalQtd" value="1" min="0">
                </div>
                <div class="modal-field">
                    <label>Em Manutenção</label>
                    <input type="number" class="modal-input" id="modalManut" value="0" min="0">
                </div>
            </div>
            <div class="modal-field">
                <label>Observações</label>
                <input type="text" class="modal-input" id="modalObs" placeholder="Opcional...">
            </div>
            <div class="modal-actions">
                <button class="btn-sm btn-cancel" onclick="fecharModal()" style="padding: 10px 20px; font-size: 13px;">Cancelar</button>
                <button class="btn-primary" onclick="salvarEquipamento()">Salvar</button>
            </div>
        </div>
    </div>
</div>

<script>
let todosEquipamentos = [];
let categorias = [];

document.addEventListener('DOMContentLoaded', () => {
    carregarDados();
    document.getElementById('searchBox').focus();
});

async function carregarDados() {
    try {
        const res = await fetch('/api/equipamentos/catalogo');
        const json = await res.json();
        if (!json.success) throw new Error(json.error);

        todosEquipamentos = [];
        categorias = Object.keys(json.data).sort();
        categorias.forEach(cat => {
            json.data[cat].forEach(e => todosEquipamentos.push(e));
        });

        // Popular select de categorias
        const sel = document.getElementById('filterCategoria');
        sel.innerHTML = '<option value="">Todas as categorias</option>' +
            categorias.map(c => `<option value="${c}">${c}</option>`).join('');

        // Popular datalist do modal
        document.getElementById('modalCatList').innerHTML = categorias.map(c => `<option value="${c}">`).join('');

        filtrar();
    } catch (err) {
        document.getElementById('tabelaContainer').innerHTML = `<div class="empty-msg">Erro: ${err.message}</div>`;
    }
}

function filtrar() {
    const q = document.getElementById('searchBox').value.toLowerCase().trim();
    const cat = document.getElementById('filterCategoria').value;

    let filtrados = todosEquipamentos;
    if (q) {
        filtrados = filtrados.filter(e =>
            e.nome.toLowerCase().includes(q) ||
            e.sku.toLowerCase().includes(q) ||
            e.categoria.toLowerCase().includes(q) ||
            (e.observacoes || '').toLowerCase().includes(q)
        );
    }
    if (cat) {
        filtrados = filtrados.filter(e => e.categoria === cat);
    }

    renderTabela(filtrados);
}

function renderTabela(lista) {
    const container = document.getElementById('tabelaContainer');

    const totalQtd = lista.reduce((s, e) => s + (e.quantidade || 0), 0);
    const totalManut = lista.reduce((s, e) => s + (e.em_manutencao || 0), 0);
    document.getElementById('stats').textContent = `${lista.length} itens • ${totalQtd} unidades • ${totalManut} em manutenção`;

    if (lista.length === 0) {
        container.innerHTML = '<div class="empty-msg">Nenhum equipamento encontrado</div>';
        return;
    }

    // Agrupar por categoria
    const agrupado = {};
    lista.forEach(e => {
        if (!agrupado[e.categoria]) agrupado[e.categoria] = [];
        agrupado[e.categoria].push(e);
    });

    let html = `<table class="equip-table"><thead><tr>
        <th style="width:90px;">SKU</th>
        <th>Nome</th>
        <th style="width:60px;text-align:center;">QTD</th>
        <th style="width:70px;text-align:center;">MANUT.</th>
        <th style="width:200px;">OBS</th>
        <th style="width:100px;text-align:right;">AÇÕES</th>
    </tr></thead><tbody>`;

    Object.keys(agrupado).sort().forEach(cat => {
        const itens = agrupado[cat];
        const catQtd = itens.reduce((s, e) => s + e.quantidade, 0);
        html += `<tr class="cat-row"><td colspan="6">${cat}<span class="cat-count">${itens.length} itens • ${catQtd} un.</span></td></tr>`;

        itens.forEach(e => {
            html += `<tr id="row-${e.id}">
                <td class="td-sku">${esc(e.sku)}</td>
                <td class="td-nome">${esc(e.nome)}</td>
                <td class="td-qtd">${e.quantidade}</td>
                <td class="td-manut">${e.em_manutencao > 0 ? e.em_manutencao : '-'}</td>
                <td class="td-obs" title="${esc(e.observacoes || '')}">${esc(e.observacoes || '-')}</td>
                <td class="td-actions">
                    <button class="btn-sm btn-edit" onclick="editarEquipamento(${e.id})">✏️</button>
                    <button class="btn-sm btn-delete" onclick="deletarEquipamento(${e.id}, '${esc(e.nome)}')">🗑️</button>
                </td>
            </tr>`;
        });
    });

    html += '</tbody></table>';
    container.innerHTML = html;
}

function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

// ---- Modal ----
function abrirModalNovo() {
    document.getElementById('modalTitulo').textContent = 'Novo Equipamento';
    document.getElementById('modalEditId').value = '';
    document.getElementById('modalSku').value = '';
    document.getElementById('modalNome').value = '';
    document.getElementById('modalCategoria').value = '';
    document.getElementById('modalQtd').value = '1';
    document.getElementById('modalManut').value = '0';
    document.getElementById('modalObs').value = '';
    document.getElementById('modalNovo').classList.add('active');
    document.getElementById('modalSku').focus();
}

function editarEquipamento(id) {
    const e = todosEquipamentos.find(eq => eq.id === id);
    if (!e) return;
    document.getElementById('modalTitulo').textContent = 'Editar Equipamento';
    document.getElementById('modalEditId').value = id;
    document.getElementById('modalSku').value = e.sku;
    document.getElementById('modalNome').value = e.nome;
    document.getElementById('modalCategoria').value = e.categoria;
    document.getElementById('modalQtd').value = e.quantidade;
    document.getElementById('modalManut').value = e.em_manutencao;
    document.getElementById('modalObs').value = e.observacoes || '';
    document.getElementById('modalNovo').classList.add('active');
    document.getElementById('modalNome').focus();
}

function fecharModal() {
    document.getElementById('modalNovo').classList.remove('active');
}

async function salvarEquipamento() {
    const editId = document.getElementById('modalEditId').value;
    const dados = {
        sku: document.getElementById('modalSku').value.trim(),
        nome: document.getElementById('modalNome').value.trim(),
        categoria: document.getElementById('modalCategoria').value.trim(),
        quantidade: document.getElementById('modalQtd').value,
        em_manutencao: document.getElementById('modalManut').value,
        observacoes: document.getElementById('modalObs').value.trim()
    };

    if (!dados.nome) { alert('Preencha o nome'); return; }
    if (!dados.sku) { alert('Preencha o SKU'); return; }

    try {
        let res;
        if (editId) {
            res = await fetch(`/api/equipamentos/item/${editId}`, {
                method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(dados)
            });
        } else {
            res = await fetch('/api/equipamentos/item', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(dados)
            });
        }
        const json = await res.json();
        if (!json.success) throw new Error(json.error);

        fecharModal();
        carregarDados();
    } catch (err) {
        alert(err.message);
    }
}

async function deletarEquipamento(id, nome) {
    if (!confirm(`Remover "${nome}" do cadastro?`)) return;
    try {
        const res = await fetch(`/api/equipamentos/item/${id}`, {method: 'DELETE'});
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        carregarDados();
    } catch (err) {
        alert(err.message);
    }
}

// Fechar modal com Escape
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') fecharModal();
});

// Gerar inventário PDF — abre a página principal com parâmetro
function gerarInventarioPDF() {
    window.open('/?inventario=1', '_blank');
}
</script>
</body>
</html>
